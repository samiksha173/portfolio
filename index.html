    --bg: #0B1220;
    --surface: #11182b;
    --surface-2: #1a263c;
    --border: #2f2b4b;
    --text: #E7ECEF;
    --muted: #9FA8C2;
    --accent: #C59CFF;
    --accent-dark: #9B7BDB;
    --blue: #8A9BE0;
    --green: #6cc7c1;
    --amber: #D9A25D;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', 'Public Sans', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;

  ::selection{ background:rgba(197,156,255,0.35); color:#0B0E14; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:980px; margin:0 auto; padding:0 28px; }

  nav{

    backdrop-filter:blur(10px);

  .navlinks a:hover{ color:var(--accent); }

  .termtitle{ margin-left:8px; font-family:var(--mono); font-size:12px; color:var(--muted); }
  .termbody{ padding:26px 24px 30px; font-family:var(--mono); font-size:14.5px; }

function useReveal(){
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if(entry.isIntersecting){ setVisible(true); obs.disconnect(); }
    }, { threshold: 0.15 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ children }){
  const [ref, visible] = useReveal();
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? "translateY(0)" : "translateY(14px)",
      transition: "opacity .5s ease, transform .5s ease"
    }}>{children}</div>
  );
}

function ToTop(){
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => setShow(window.scrollY > 500);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <div className={"totop" + (show ? " show" : "")} onClick={() => window.scrollTo({top:0, behavior:"smooth"})}>↑</div>
  );
}

      <footer>© {new Date().getFullYear()} Samiksha Sominath tarte</footer>
      <ToTop />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
