<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Samiksha Tarte — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="profile.jpg" as="image">
  <link rel="preload" href="resume.pdf" as="fetch" crossorigin="anonymous">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg: #0B1220;
    --surface: #11182b;
    --surface-2: #1a263c;
    --border: #2f2b4b;
    --text: #E7ECEF;
    --muted: #9FA8C2;
    --accent: #C59CFF;
    --accent-dark: #9B7BDB;
    --blue: #8A9BE0;
    --green: #6cc7c1;
    --amber: #D9A25D;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', 'Public Sans', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 10% 20%, rgba(197,156,255,0.18), transparent 28%),
      radial-gradient(circle at 90% 10%, rgba(138,155,224,0.16), transparent 25%),
      radial-gradient(circle at 70% 80%, rgba(108,199,193,0.16), transparent 30%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    isolation:isolate;
  }
  body::before, body::after{
    content:"";
    position:fixed;
    inset:-20%;
    pointer-events:none;
    z-index:-2;
    filter:blur(70px);
    opacity:.8;
    animation:drift 18s ease-in-out infinite alternate;
  }
  body::before{
    background:radial-gradient(circle, rgba(197,156,255,0.22) 0%, rgba(197,156,255,0) 42%);
    transform:translate3d(-6%, -4%, 0);
  }
  body::after{
    background:radial-gradient(circle, rgba(108,199,193,0.2) 0%, rgba(108,199,193,0) 38%);
    animation-duration:24s;
    transform:translate3d(6%, 4%, 0);
  }
  @keyframes drift{ from{ transform:translate3d(-3%, -2%, 0) scale(1);} to{ transform:translate3d(3%, 2%, 0) scale(1.08);} }
  ::selection{ background:rgba(197,156,255,0.35); color:#0B0E14; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:980px; margin:0 auto; padding:0 28px; }

  /* ---- NAV ---- */
  nav{
    position:sticky; top:0; z-index:50;
    backdrop-filter:blur(10px);
    background:rgba(11,14,20,0.85);
    border-bottom:1px solid var(--border);
  }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; height:60px; }
  .brand{ font-family:var(--mono); font-weight:600; font-size:15px; color:var(--text); }
  .brand span{ color:var(--accent); }
  .navlinks{ display:flex; gap:26px; font-family:var(--mono); font-size:13px; color:var(--muted); align-items:center; }
  .navlinks a{ transition:color .15s; position:relative; padding:8px 10px; border-radius:6px; }
  .navlinks a:hover{ color:var(--accent); background:rgba(197,156,255,0.04); }
  .mobile-toggle{
    display:none; background:transparent; border:1px solid rgba(255,255,255,0.03); padding:10px 12px; border-radius:10px; cursor:pointer;
    color:var(--muted); font-family:var(--mono); font-size:18px; line-height:1; transition:background .12s, color .12s, transform .12s;
  }
  .mobile-toggle:focus{ outline:2px solid rgba(197,156,255,0.18); }
  .navlinks a:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; border-radius:2px; }
  /* mobile overlay (separate from desktop navlinks) */
  .mobile-overlay{ display:none; }
  .mobile-overlay.open{ display:flex; position:fixed; top:62px; left:0; right:0; bottom:0; background:rgba(11,14,20,0.96); backdrop-filter:blur(10px); z-index:58; flex-direction:column; align-items:stretch; justify-content:flex-start; padding:24px 18px; overflow-y:auto; -webkit-overflow-scrolling:touch; gap:12px; }
  .mobile-overlay.open::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(197,156,255,0.12), rgba(108,199,193,0.08));
    pointer-events:none;
  }
  .mobile-overlay.open a{
    display:block; width:100%; max-width:none; margin:0; padding:16px 18px; font-size:17px; color:var(--text); text-align:center; border-radius:12px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); transition:transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .mobile-overlay.open a:hover{ transform:translateY(-1px); background:rgba(197,156,255,0.16); border-color:rgba(197,156,255,0.28); color:#fff; }
  .mobile-overlay.open a:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; }

  /* ---- HERO / TERMINAL ---- */
  header.hero{ padding:90px 0 70px; }
  .termwin{
    position:relative;
    isolation:isolate;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);
    animation:floatCard 6s ease-in-out infinite;
    transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  }
  .termwin::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    padding:1px;
    background:linear-gradient(120deg, rgba(197,156,255,0.8), rgba(138,155,224,0.25), rgba(108,199,193,0.8));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:.6;
    animation:spinBorder 8s linear infinite;
    z-index:-1;
  }
  .termwin:hover{ transform:translateY(-4px) rotateX(1deg) rotateY(-0.6deg); box-shadow:0 20px 56px -20px rgba(197,156,255,0.26); border-color:rgba(197,156,255,0.36); }
  @keyframes floatCard{ 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(-6px);} }
  @keyframes spinBorder{ to{ transform:rotate(360deg);} }
  .termbar{
    display:flex; align-items:center; gap:8px;
    padding:10px 14px; background:var(--surface-2);
    border-bottom:1px solid var(--border);
    position:relative; overflow:hidden;
  }
  .termbar::after{
    content:"";
    position:absolute; inset:-100% 0 0 -100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.09), transparent);
    animation:sweep 4s linear infinite;
  }
  @keyframes sweep{ to{ transform:translateX(220%);} }
  .dot{ width:10px; height:10px; border-radius:50%; }
  .dot.r{ background:#FF5F57; } .dot.y{ background:#FEBC2E; } .dot.g{ background:#28C840; }
  .termtitle{ margin-left:8px; font-family:var(--mono); font-size:12px; color:var(--muted); }
  .termbody{ padding:26px 24px 30px; font-family:var(--mono); font-size:14.5px; }
  .termline{ color:var(--muted); margin-bottom:6px; }
  .termline .prompt{ color:var(--accent); }
  .termline .cmd{ color:var(--text); }
  .out-name{ font-size:36px; font-weight:700; color:var(--text); margin:10px 0 4px; font-family:var(--sans); background:linear-gradient(90deg, #fff, var(--accent), #fff); -webkit-background-clip:text; background-clip:text; color:transparent; background-size:200% 100%; animation:shineText 5s linear infinite; }
  .out-role{ color:var(--accent); font-size:17px; margin-bottom:14px; letter-spacing:0.01em; }
  @keyframes shineText{ to{ background-position:200% 0; } }
  .caret{ display:inline-block; width:9px; height:18px; background:var(--accent); margin-left:4px; animation:blink 1s steps(1) infinite; vertical-align:-3px;}
  @keyframes blink{ 50%{ opacity:0; } }
  .out-desc{ color:var(--muted); max-width:520px; margin-bottom:22px; font-family:var(--sans); font-size:15px;}
  .hero-cta{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .btn{
    font-family:var(--mono); font-size:13px; padding:10px 18px; border-radius:6px;
    border:1px solid var(--border); transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, color .2s ease; cursor:pointer;
    position:relative; overflow:hidden;
  }
  .btn::before{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent); transform:translateX(-100%); transition:transform .38s cubic-bezier(.2,.9,.2,1); }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(0,0,0,0.16); }
  .btn:hover::before{ transform:translateX(120%); }
  .btn-primary{ background:var(--accent); color:#0B0E14; border-color:var(--accent); font-weight:600; }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-ghost{ color:var(--text); }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .hero-links{ display:flex; gap:18px; font-family:var(--mono); font-size:13px; color:var(--muted); }
  .hero-links a:hover{ color:var(--accent); }
  .hero-body-grid{ display:grid; grid-template-columns:1fr 220px; gap:20px; align-items:start; }
  .hero-avatar{ display:flex; justify-content:center; align-items:center; padding-top:8px; }
  .hero-photo{ width:220px; aspect-ratio:1 / 1; object-fit:cover; border-radius:22px; border:1px solid rgba(197,156,255,0.16); box-shadow:0 18px 36px rgba(0,0,0,0.2); animation:slowFloat 6.5s ease-in-out infinite; transition:transform .22s ease, box-shadow .22s ease; }
  .hero-photo:hover{ transform:scale(1.02) rotate(-2deg); box-shadow:0 28px 60px rgba(0,0,0,0.3); }
  @keyframes slowFloat{ 0%,100%{ transform:translateY(0px);} 50%{ transform:translateY(-6px);} }

  @media (max-width:900px){ .hero-body-grid{ grid-template-columns:1fr; } .hero-photo{ width:180px; margin:0 auto; } }

  /* ---- SECTION / CELL FRAMEWORK ---- */
  section{ padding:64px 0; border-top:1px solid var(--border); }
  .cell{
    display:grid; grid-template-columns:64px 1fr; gap:0;
  }
  .cell-marker{
    font-family:var(--mono); font-size:12.5px; padding-top:2px;
  }
  .cell-marker .in{ color:var(--accent); }
  .cell-marker .out{ color:var(--accent-dark); margin-top:18px; }
  .cell-head{ font-family:var(--mono); font-size:13px; color:var(--muted); margin-bottom:6px; }
  h2.sec-title{
    font-family:var(--sans); font-size:26px; font-weight:800; color:var(--text); margin-bottom:18px;
    letter-spacing:-0.01em;
  }
  .sec-title .tag{ color:var(--amber); }

  /* ---- ABOUT ---- */
  .about-text{ color:var(--muted); max-width:640px; font-size:15.5px; }
  .about-text strong{ color:var(--text); font-weight:600; }
  .facts{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:26px; max-width:640px; }
  .fact{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
  .fact .k{ font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .fact .v{ font-size:14.5px; margin-top:4px; color:var(--text); font-weight:600; }

  /* ---- SKILLS AS IMPORTS ---- */
  .import-block{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:20px 22px; font-family:var(--mono); font-size:14px; overflow-x:auto;
  }
  .imp-kw{ color:#C792EA; }
  .imp-mod{ color:var(--amber); }
  .imp-as{ color:#C792EA; }
  .imp-name{ color:var(--accent); }
  .import-block .cm{ color:var(--muted); }
  .import-block div{ white-space:pre-wrap; margin-bottom:2px; word-break:break-word; }

  /* Prevent horizontal overflow on small screens: allow card content to shrink and wrap */
  .cell, .proj-card, .proj-body, .fact, .contact-card, .proj-file, .commit { min-width:0; }
  .proj-desc, .out-desc, .about-text, .commit-meta, .commit-msg, .contact-card .v, .proj-file, .proj-body, .import-block div {
    overflow-wrap:anywhere;
    word-break:break-word;
    hyphens:auto;
    white-space:normal;
  }

  /* ---- PROJECTS AS FILE CARDS ---- */
  .proj-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:680px){ .proj-grid{ grid-template-columns:1fr; } }
  .proj-card{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    overflow:hidden; transition:transform .28s cubic-bezier(.2,.9,.2,1), border-color .22s ease, box-shadow .28s cubic-bezier(.2,.9,.2,1);
    position:relative; will-change:transform;
  }
  .proj-card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(197,156,255,0.08), transparent 35%, rgba(108,199,193,0.08));
    opacity:0; pointer-events:none;
    transition:opacity .28s cubic-bezier(.2,.9,.2,1);
  }
  .proj-card:hover{ transform:translateY(-6px); border-color:rgba(197,156,255,0.45); box-shadow:0 20px 46px rgba(0,0,0,0.22); }
  .proj-card:hover::before{ opacity:1; }
  .proj-file{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    background:var(--surface-2); border-bottom:1px solid var(--border);
    font-family:var(--mono); font-size:12.5px; color:var(--muted);
  }
  .proj-file .ext{ color:var(--amber); }
  .proj-body{ padding:16px 16px 18px; }
  .proj-name{ font-size:16px; font-weight:700; margin-bottom:6px; }
  .proj-desc{ color:var(--muted); font-size:13.5px; margin-bottom:12px; min-height:38px;}
  .proj-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tag-pill{
    font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:20px;
    border:1px solid var(--border); color:var(--muted);
  }
  .proj-links{ display:flex; gap:16px; font-family:var(--mono); font-size:12.5px; }
  .proj-links a{ color:var(--accent); }
  .proj-links a:hover{ color:var(--accent-dark); }

  /* ---- EDUCATION TIMELINE (git-log style) ---- */
  .commit{ display:flex; gap:14px; padding:14px 0; border-bottom:1px dashed var(--border); }
  .commit:last-child{ border-bottom:none; }
  .commit-dot{ width:10px; height:10px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0; }
  .commit-hash{ font-family:var(--mono); color:var(--amber); font-size:12px; }
  .commit-msg{ font-weight:600; margin:2px 0; }
  .commit-meta{ color:var(--muted); font-size:13px; }

  /* ---- GITHUB ACTIVITY ---- */
  .contrib{ display:grid; grid-template-columns:repeat(26,1fr); gap:3px; max-width:640px; }
  .sq{ width:100%; padding-bottom:100%; border-radius:2px; background:var(--surface-2); }
  .stats-row{ display:flex; gap:30px; margin-top:22px; flex-wrap:wrap; }
  .stat{ font-family:var(--mono); }
  .stat .num{ font-size:22px; font-weight:700; color:var(--accent); }
  .stat .lbl{ font-size:12px; color:var(--muted); }

  /* ---- CONTACT ---- */
  .contact-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:18px;
  }
  .contact-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:20px 22px; transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    min-height:120px;
    position:relative;
  }
  .contact-card::after{
    content:"";
    position:absolute; inset:auto 16px 14px 16px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(197,156,255,0.4), transparent);
    transform:scaleX(0.1);
    transform-origin:center;
    transition:transform .25s ease;
  }
  .contact-card:hover{ border-color:rgba(197,156,255,0.4); transform:translateY(-3px); box-shadow:0 12px 28px rgba(0,0,0,0.16); }
  .contact-card:hover::after{ transform:scaleX(1); }
  .contact-card .k{ font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .contact-card .v{ margin-top:8px; font-weight:600; line-height:1.5; word-break:break-word; }
  .contact-card .v a{ color:var(--accent); text-decoration:none; }
  .contact-card .v a:hover{ color:var(--accent-dark); text-decoration:underline; }

  footer{ padding:30px 0; text-align:center; color:var(--muted); font-family:var(--mono); font-size:12px; border-top:1px solid var(--border); }

  .totop{
    position:fixed; right:22px; bottom:22px; width:42px; height:42px; border-radius:50%;
    background:var(--surface); border:1px solid var(--border); color:var(--accent);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:40;
    font-family:var(--mono); transition:.15s; opacity:0; pointer-events:none;
  }
  .totop.show{ opacity:1; pointer-events:auto; }
  .totop:hover{ border-color:var(--accent); }

  @media (prefers-reduced-motion: reduce){
    .caret{ animation:none; }
    html{ scroll-behavior:auto; }
  }

  /* Respect reduced motion preference for larger animated elements */
  @media (prefers-reduced-motion: reduce){
    .termwin, .hero-photo, .proj-card, .proj-card::before, .termbar::after, .btn::before, body::before, body::after { animation: none !important; transition: none !important; }
  }
  @media (max-width:900px){
    .wrap{ padding:0 18px; }
    .cell{ grid-template-columns:1fr; }
    .hero-body-grid{ grid-template-columns:1fr; }
    .hero-photo{ width:180px; margin:0 auto; }
    .nav .wrap{ flex-wrap:wrap; }
    .hero-links{ justify-content:flex-start; flex-wrap:wrap; gap:10px; }
    .termsbody{ padding:20px 18px 24px; }
    .proj-grid{ grid-template-columns:1fr; }
    .stats-row{ flex-direction:column; gap:16px; }
    .mobile-toggle{ display:block; }
    .navlinks{ display:none; }
    .navlinks.open{
      display:flex; position:fixed; top:62px; left:0; right:0; bottom:0;
      background:rgba(11,14,20,0.88); backdrop-filter:blur(6px);
      border-top:1px solid rgba(255,255,255,0.02); flex-direction:column;
      padding:20px 16px; gap:18px; z-index:60; align-items:center; justify-content:flex-start;
      max-height: calc(100vh - 62px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation:navDrop .18s ease-out;
    }
    .navlinks.open a{ padding:14px 18px; font-size:18px; color:var(--text); background:transparent; border-radius:8px; width:100%; max-width:540px; text-align:center; display:block; }
    @keyframes navDrop{ from{ transform:translateY(-6px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
  }
  @media (max-width:760px){
    .facts{ grid-template-columns:1fr 1fr; }
    .hero-cta{ flex-direction:column; align-items:flex-start; }
    .btn{ width:100%; text-align:center; }
    .contact-card{ min-height:auto; }
    .commit{ flex-direction:column; gap:10px; }
    .commit-dot{ margin-top:0; }
  }
  @media (max-width:640px){
    .facts{ grid-template-columns:1fr; }
    .navlinks{ flex-wrap:wrap; justify-content:center; gap:12px; font-size:12px; }
    .out-name{ font-size:28px; }
    .hero-links{ justify-content:center; }
    .hero-photo{ width:160px; }
    .btn{ font-size:12px; padding:10px 16px; }
    .proj-file{ font-size:12px; }
    .proj-body{ padding:14px; }
    .contact-grid{ gap:14px; }
    footer{ padding:20px 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const PROJECTS = [
  { file:"blockchain_demo", ext:".java", name:"Simple Blockchain Demo", desc:"Fundamental blockchain concepts — blocks, hashing, and chain validation.", tags:["Java","Blockchain"], repo:"https://github.com/samiksha173" },
  { file:"blockchain_gui", ext:".java", name:"Simple Blockchain GUI", desc:"Graphical blockchain app built with Java to visualize core concepts.", tags:["Java","Blockchain"], repo:"https://github.com/samiksha173" },
  { file:"titanic_models", ext:".ipynb", name:"Titanic Supervised Models", desc:"Implementing supervised learning models to predict survival on the Titanic dataset.", tags:["Python","Scikit-learn"], repo:"https://github.com/samiksha173" },
  { file:"job_tracker", ext:".py", name:"Job Application Tracker", desc:"Full-stack web app with calendar-driven candidate management and JSON data workflows.", tags:["Python","Flask","JavaScript"], repo:"https://github.com/samiksha173" },
  { file:"titanic_eda", ext:".ipynb", name:"Titanic Dataset", desc:"Exploratory data analysis and ML experiments on the Titanic dataset.", tags:["Python","Pandas","Matplotlib"], repo:"https://github.com/samiksha173" },
  { file:"diabetes_predict", ext:".ipynb", name:"Diabetes Prediction", desc:"Predicting diabetes risk from patient health data using supervised learning.", tags:["Python","Machine Learning"], repo:"https://github.com/samiksha173" },
  { file:"ad_sales", ext:".ipynb", name:"Advertising Sales", desc:"Data analysis and predictive modeling on advertising spend vs. sales.", tags:["Python","Pandas","ML"], repo:"https://github.com/samiksha173" },
];

const EDU = [
  { hash:"a3f9c1e", msg:"B.Tech, Computer Science & Engineering", meta:"In progress · Focus: ML, Blockchain, Android" },
  { hash:"7c02bd4", msg:"Started exploring Machine Learning", meta:"Scikit-learn, Pandas, NumPy projects" },
  { hash:"f19e0aa", msg:"Started exploring Blockchain", meta:"Built core blockchain logic in Java" },
];

function useReveal(){
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if(entry.isIntersecting){ setVisible(true); obs.disconnect(); }
    }, { threshold: 0.15 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ children, delay = 0 }){
  const [ref, visible] = useReveal();
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? "translateY(0) scale(1)" : "translateY(18px) scale(0.995)",
      filter: visible ? "blur(0px)" : "blur(6px)",
      transition: "opacity .62s cubic-bezier(.16,.98,.4,1), transform .62s cubic-bezier(.16,.98,.4,1), filter .62s cubic-bezier(.16,.98,.4,1)",
      transitionDelay: `${delay}ms`,
      willChange: "transform, opacity, filter"
    }}>{children}</div>
  );
}

<script>
(function(){
  // Prefetch resume and avatar in a non-blocking way to make downloads feel instant.
  if (typeof navigator !== 'undefined' && navigator.connection && navigator.connection.saveData) return;
  function doPrefetch(){
    try{
      fetch('resume.pdf').then(r => { if(!r.ok) throw new Error('fetch-fail'); return r.blob(); }).then(blob => {
        const url = URL.createObjectURL(blob);
        var el = document.getElementById('resume-link');
        if(el){ el.href = url; el.dataset.prefetched = 'true'; }
        window._resumeBlobUrl = url;
      }).catch(()=>{});
    }catch(e){}
    // warm image cache
    try{ const img = new Image(); img.src = 'profile.jpg'; }catch(e){}
  }
  if('requestIdleCallback' in window){ requestIdleCallback(doPrefetch, {timeout:2500}); }
  else { window.addEventListener('load', function(){ setTimeout(doPrefetch, 1200); }); }
})();
</script>
